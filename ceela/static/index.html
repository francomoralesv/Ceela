<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Calculator - Temporal</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        .status-card {
            border-left: 4px solid #dee2e6;
            transition: all 0.3s;
        }
        .status-queued { border-left-color: #ffc107; }
        .status-running { border-left-color: #0dcaf0; }
        .status-completed { border-left-color: #198754; }
        .status-error { border-left-color: #dc3545; }
        .status-cancelled { border-left-color: #6c757d; }
        
        .progress-animated {
            animation: progress-animation 2s ease-in-out infinite;
        }
        
        @keyframes progress-animation {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background-color: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        
        .connection-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .connected { background-color: #198754; }
        .disconnected { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col">
                <h1 class="h3">
                    <i class="bi bi-lightning-charge text-warning"></i>
                    Energy Calculator
                    <small class="text-muted">Temporal.io</small>
                </h1>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <span class="badge bg-secondary">v3.0.0</span>
                    <span class="text-muted">WebSocket:</span>
                    <span class="connection-indicator disconnected" id="wsStatus"></span>
                    <span class="text-muted small" id="wsStatusText">Desconectado</span>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Control Panel -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-play-circle"></i>
                            Control de Cálculos
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="calculationForm">
                            <div class="mb-3">
                                <label for="projectId" class="form-label">Project ID</label>
                                <input type="number" class="form-control" id="projectId" name="projectId" value="1" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="userId" class="form-label">User ID (opcional)</label>
                                <input type="number" class="form-control" id="userId" name="userId" value="1">
                            </div>
                            
                            <div class="mb-3">
                                <label for="version" class="form-label">Versión</label>
                                <select class="form-select" id="version" name="version">
                                    <option value="v3">v3</option>
                                    <option value="v2">v2</option>
                                </select>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="forceData" name="forceData">
                                <label class="form-check-label" for="forceData">
                                    Forzar recálculo de datos
                                </label>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="startBtn">
                                    <i class="bi bi-play-fill"></i>
                                    Iniciar Cálculo
                                </button>
                                <button type="button" class="btn btn-danger d-none" id="cancelBtn">
                                    <i class="bi bi-stop-fill"></i>
                                    Cancelar
                                </button>
                            </div>
                        </form>
                        
                        <hr>
                        
                        <!-- Quick Actions -->
                        <div class="mb-3">
                            <h6>Acciones Rápidas</h6>
                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-secondary btn-sm" onclick="checkHealth()">
                                    <i class="bi bi-heart-pulse"></i>
                                    Health Check
                                </button>
                                <button class="btn btn-outline-info btn-sm" onclick="loadHistory()">
                                    <i class="bi bi-clock-history"></i>
                                    Ver Historial
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status & Results -->
            <div class="col-md-8">
                <!-- Current Calculation Status -->
                <div class="card mb-3" id="statusCard" style="display: none;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-activity"></i>
                            Estado del Cálculo
                        </h5>
                        <span class="badge bg-secondary" id="calculationId"></span>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold" id="statusText">Iniciando...</span>
                            <span class="text-muted small" id="timestamp"></span>
                        </div>
                        
                        <div class="progress mb-3" style="height: 8px;">
                            <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
                        </div>
                        
                        <p class="text-muted mb-0" id="statusMessage">Preparando cálculo...</p>
                        
                        <!-- Workflow Info -->
                        <div class="mt-3 p-2 bg-light rounded">
                            <small class="text-muted">
                                <strong>Workflow ID:</strong> <span id="workflowId">-</span><br>
                                <strong>Run ID:</strong> <span id="runId">-</span>
                            </small>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="card mb-3" id="resultsCard" style="display: none;">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-graph-up"></i>
                            Resultados
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="resultsContent">
                            <!-- Results will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- History -->
                <div class="card mb-3" id="historyCard" style="display: none;">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-clock-history"></i>
                            Historial de Cálculos
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="historyContent">
                            <!-- History will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- Logs -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-terminal"></i>
                            Logs
                        </h5>
                        <button class="btn btn-outline-secondary btn-sm" onclick="clearLogs()">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="log-container p-3" id="logContainer">
                            <div class="text-muted">Esperando eventos...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
